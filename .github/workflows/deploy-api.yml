name: Deploy API to Contabo

on:
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'packages/db/**'
      - 'package.json'
      - 'pnpm-workspace.yaml'
      - 'pnpm-lock.yaml'
      - 'scripts/deploy-naracharm-api.sh'
      - '.github/workflows/deploy-api.yml'
  workflow_dispatch:

concurrency:
  group: naracharm-contabo-api
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & Deploy naracharm API
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NARA_RELEASE: ${{ github.sha }}
      NARA_ARCHIVE: naracharm-src-${{ github.run_id }}-${{ github.run_attempt }}.tar.gz

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Package source
        run: |
          tar --exclude='node_modules' --exclude='.next' --exclude='.git' --exclude='out' \
            --exclude='.env*' --exclude='*.pem' --exclude='.vercel' \
            -czf "$NARA_ARCHIVE" \
            package.json pnpm-workspace.yaml pnpm-lock.yaml \
            apps/web packages/db scripts/deploy-naracharm-api.sh

      - name: Upload source to Contabo
        uses: appleboy/scp-action@v0.1.7
        with:
          host: 169.58.107.188
          username: root
          key: ${{ secrets.CONTOBO_SSH_KEY }}
          source: ${{ env.NARA_ARCHIVE }}
          target: /opt/naracharm/src

      - name: Migrate, verify and publish on Contabo
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: 169.58.107.188
          username: root
          key: ${{ secrets.CONTOBO_SSH_KEY }}
          envs: NARA_RELEASE,NARA_ARCHIVE
          command_timeout: 25m
          script: |
            set -eu
            archive="/opt/naracharm/src/$NARA_ARCHIVE"
            stage=$(mktemp -d /opt/naracharm/src/release.XXXXXX)
            trap 'rm -rf -- "$stage"; rm -f -- "$archive"' EXIT
            tar -xzf "$archive" -C "$stage"
            cd "$stage"
            bash scripts/deploy-naracharm-api.sh "$NARA_RELEASE"
