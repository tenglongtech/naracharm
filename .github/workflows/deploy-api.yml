name: Deploy API to Contabo

on:
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'packages/db/**'
      - '.github/workflows/deploy-api.yml'
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Deploy naracharm API
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Package source
        run: |
          # 打包源码（排除大目录），发送到服务器构建
          tar --exclude='node_modules' --exclude='.next' --exclude='.git' --exclude='out' \
            -czf /tmp/naracharm-src.tar.gz \
            package.json pnpm-workspace.yaml pnpm-lock.yaml \
            apps/web packages/db
          ls -la /tmp/naracharm-src.tar.gz

      - name: Upload source to Contabo
        uses: appleboy/scp-action@v0.1.7
        with:
          host: 169.58.107.188
          username: root
          key: ${{ secrets.CONTOBO_SSH_KEY }}
          source: /tmp/naracharm-src.tar.gz
          target: /opt/naracharm/src

      - name: Build & Restart on Contabo
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: 169.58.107.188
          username: root
          key: ${{ secrets.CONTOBO_SSH_KEY }}
          script: |
            set -e
            cd /opt/naracharm/src
            # 更新源码（保留修复过的 Dockerfile）
            rm -rf apps packages pnpm-lock.yaml pnpm-workspace.yaml package.json
            tar -xzf naracharm-src.tar.gz
            rm naracharm-src.tar.gz
            # 确保 Dockerfile 的 builder 阶段有 corepack（修复遗漏）
            if ! grep -q "corepack" apps/web/Dockerfile; then
              echo "Dockerfile 缺 corepack，重新写入"
              cat > apps/web/Dockerfile << 'EOF'
FROM node:22-alpine AS deps
WORKDIR /app
RUN corepack enable
COPY package.json pnpm-workspace.yaml pnpm-lock.yaml ./
COPY apps/web/package.json apps/web/package.json
COPY packages/db/package.json packages/db/package.json
RUN pnpm install --frozen-lockfile --filter web... 2>/dev/null || pnpm install --filter web...

FROM node:22-alpine AS builder
WORKDIR /app
RUN corepack enable
COPY --from=deps /app/node_modules ./node_modules
COPY --from=deps /app/apps/web/node_modules ./apps/web/node_modules
COPY --from=deps /app/packages/db/node_modules ./packages/db/node_modules
COPY . .
ENV BUILD_TARGET=backend
RUN pnpm --filter web build

FROM node:22-alpine AS runner
WORKDIR /app
ENV NODE_ENV=production
ENV PORT=37001
ENV HOSTNAME=0.0.0.0
COPY --from=builder /app/apps/web/.next/standalone ./
COPY --from=builder /app/apps/web/.next/static ./apps/web/.next/static
COPY --from=builder /app/apps/web/public ./apps/web/public
WORKDIR /app/apps/web
COPY --from=builder /app/apps/web/.next/standalone/apps/web/server.js ./server.js
EXPOSE 37001
CMD ["node", "server.js"]
EOF
            fi
            # 构建新镜像
            docker build -t naracharm-api:latest -f apps/web/Dockerfile .
            # 重启容器
            docker rm -f naracharm-api 2>/dev/null || true
            docker run -d \
              --name naracharm-api \
              --network naracharm_naracharm-net \
              --env-file /opt/naracharm/api/.env \
              -p 127.0.0.1:37001:37001 \
              --restart unless-stopped \
              --memory 2g \
              naracharm-api:latest
            echo "✅ API 已重新部署"
            sleep 8
            curl -s http://127.0.0.1:37001/api/health || echo "⚠️ 健康检查失败"
